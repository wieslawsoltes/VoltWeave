name: Test and publish GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize production releases without cancelling an active Pages deployment.
concurrency:
  group: voltweave-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run core and persistence tests
        run: npm test
      - name: Generate engineering examples
        run: npm run examples
      - name: Build standalone Pages site
        run: npm run build:pages
      - name: Validate release files
        run: |
          test -s _site/index.html
          test -s _site/voltweave.html
          test -s _site/examples/conveyor-documentation.html
          test -f _site/.nojekyll
          node --input-type=module -e "import fs from 'node:fs'; const v = JSON.parse(fs.readFileSync('_site/version.json')); if (v.commit !== process.env.GITHUB_SHA) throw Error('Unexpected source commit');"
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
          retention-days: 7

  publish:
    name: Publish and verify
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Inspect Pages publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{build_type, source, html_url, status, https_enforced}'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify deployed commit over HTTPS
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}/"
          export SITE_URL
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const base = new URL(process.env.SITE_URL);
          if (base.protocol !== 'https:') throw new Error('Pages must be served over HTTPS');
          const expected = process.env.GITHUB_SHA;
          const endpoints = ['index.html', 'voltweave.html', 'examples/conveyor-documentation.html'];
          let lastError;
          for (let attempt = 1; attempt <= 40; attempt++) {
            try {
              const versionUrl = new URL('version.json', base);
              versionUrl.search = new URLSearchParams({ commit: expected, attempt: String(attempt) }).toString();
              const response = await fetch(versionUrl, { signal: AbortSignal.timeout(15000), cache: 'no-store' });
              if (!response.ok) throw new Error(`version.json returned HTTP ${response.status}`);
              const version = await response.json();
              if (version.commit !== expected) throw new Error(`Expected ${expected}; received ${version.commit}`);
              for (const endpoint of endpoints) {
                const url = new URL(endpoint, base);
                url.searchParams.set('commit', expected);
                const page = await fetch(url, { signal: AbortSignal.timeout(15000), cache: 'no-store' });
                if (!page.ok) throw new Error(`${endpoint} returned HTTP ${page.status}`);
                const html = await page.text();
                if (!html.includes('VoltWeave')) throw new Error(`${endpoint} did not contain the application branding`);
                console.log(`Verified HTTP ${page.status}: ${url} (${Buffer.byteLength(html)} bytes)`);
              }
              console.log(`Verified live source commit: ${version.commit}`);
              await appendFile(process.env.GITHUB_STEP_SUMMARY,
                `## Published VoltWeave\n\nSite: ${base}\n\nVerified source commit: \`${version.commit}\`\n\nApplication, standalone download and example documentation all returned HTTP 200.\n`);
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.warn(`Verification ${attempt}/40: ${error.message}`);
              if (attempt < 40) await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          throw new Error('The public site did not serve the expected release before the verification deadline.', { cause: lastError });
          NODE
